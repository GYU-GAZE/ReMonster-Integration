modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/GYU-GAZE/ReMonster-Integration/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/GYU-GAZE/ReMonster-Integration"
authors="GYU:GAZE Works"
description='''
Cross-mod integration layer for the Re:Monster-style isekai modpack. Tensura: Reincarnated is the gameplay spine; this addon coordinates mob profiles, EP, skills, ecology, MCA villagers/guards, Townstead races, subordinates, dungeons and quests.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tensura"
type="required"
versionRange="[2.0.1.2]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mca"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="townstead"
type="optional"
ordering="AFTER"
side="BOTH"
