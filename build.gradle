plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    manasCoreBundle
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Tensura itself is available as a normal CurseMaven artifact.
    compileOnly 'curse.maven:tensura-reincarnated-643695:8665599'

    // ManasCore's published NeoForge release is a bundle whose API modules are nested jars.
    // Resolve the exact pack release, extract those modules below, and put them on javac's classpath.
    manasCoreBundle 'curse.maven:manascore-619025:8022425'
    compileOnly 'dev.architectury:architectury-neoforge:13.0.8'
    compileOnly fileTree(dir: layout.buildDirectory.dir('manascore-compile-modules'), include: ['*.jar'])

    // A local dev instance still uses the exact jars from the modpack under ./libs.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    localRuntime fileTree(dir: 'libs', include: ['*.jar'])
}

var extractManasCoreModules = tasks.register('extractManasCoreModules', Sync) {
    from({ configurations.manasCoreBundle.collect { zipTree(it) } }) {
        include '**/*.jar'
        eachFile { details ->
            // Flatten nested module paths. Module jar names are unique inside the ManasCore bundle.
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('manascore-compile-modules')
}

tasks.named('compileJava').configure {
    dependsOn extractManasCoreModules
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
