name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Inspect Better Subordinates bytecode
        shell: bash
        run: |
          gradle dependencies --configuration betterSubsInspect --quiet --no-configuration-cache >/dev/null
          JAR=$(find ~/.gradle/caches/modules-2/files-2.1/curse.maven/tensura-better-subordinates-1489224/8414486 -name '*.jar' | head -n 1)
          echo "=== Better Subordinates jar: $JAR ==="
          for CLS in \
            com.trbeyond.tensura_better_subs.entity.ExpandedSkillStorage \
            com.trbeyond.tensura_better_subs.entity.IExpandedSkillAcquisition \
            com.trbeyond.tensura_better_subs.mixin.tensura.entity.template.MixinTensuraTamableEntity \
            com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill \
            com.trbeyond.tensura_better_subs.network.c2s.SubordinateSkillGrantingPacket \
            com.trbeyond.tensura_better_subs.network.c2s.RequestSubordinateAbilityModeChangePacket; do
            echo
            echo "===== $CLS ====="
            javap -classpath "$JAR" -p -c "$CLS" || true
          done

      - name: Build
        run: gradle build --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
