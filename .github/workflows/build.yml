name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect Better Subordinates status transition
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.client.screen.MixinHumanoidMainScreen
          echo '=== OPEN PAYLOAD ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.network.s2c.OpenHumanoidSkillMenuPayload
          echo '=== THOUGHT COMM MIXIN ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill

      - name: Inspect Tensura goblin dwarf and mount internals
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          echo "TENSURA_JAR=$JAR"
          echo '=== MATCHING CLASSES ==='
          jar tf "$JAR" | grep '\.class$' | grep -Ei '(goblin|dwarf|basilisk|mount|reputation|trade|profession)' | sed 's#/#.#g;s#\.class$##' | sort
          echo '=== SELECTED BYTECODE ==='
          for C in $(jar tf "$JAR" | grep '\.class$' | grep -Ei '(GoblinEntity|DwarfEntity|TensuraMountEntity|BasiliskEntity|DwarfReputation|DwarvenReputation)' | grep -Ev '(client|renderer|model)' | sed 's#/#.#g;s#\.class$##' | sort -u); do
            echo "===== $C ====="
            javap -classpath "$JAR" -p -c "$C" || true
          done

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
