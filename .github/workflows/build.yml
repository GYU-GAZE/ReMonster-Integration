name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect universal character APIs
        if: success()
        shell: bash
        run: |
          TENSURA=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          MCA=$(find ~/.gradle/caches -type f -name '*8658484*.jar' | head -n 1)
          BETTER=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          echo "TENSURA=$TENSURA"
          echo "MCA=$MCA"
          echo "BETTER=$BETTER"

          echo '=== TENSURA CANDIDATE CLASSES: CAST / ACTIVATE / AI ==='
          jar tf "$TENSURA" | grep '\.class$' | grep -Ei '(skill|ability).*(goal|ai|use|cast|activate)|goal.*(skill|ability)|skillhelper|skillmanager|skillstorage' | head -n 250 || true

          echo '=== TENSURA CANDIDATE CLASSES: MANUAL / BATTLEWILL / MAGIC ==='
          jar tf "$TENSURA" | grep '\.class$' | grep -Ei '(manual|battlewill|battle_will|magic.*book|book.*magic|skill.*book|book.*skill|magic.*item|item.*magic)' | head -n 250 || true

          echo '=== TENSURA Skill / TensuraSkill / SkillHelper ==='
          javap -classpath "$TENSURA" -p io.github.manasmods.tensura.ability.skill.Skill || true
          javap -classpath "$TENSURA" -p io.github.manasmods.tensura.ability.TensuraSkill || true
          javap -classpath "$TENSURA" -p -c io.github.manasmods.tensura.ability.SkillHelper || true

          echo '=== MCA CANDIDATE CLASSES: COMBAT / PANIC / HELP / INVENTORY ==='
          jar tf "$MCA" | grep '\.class$' | grep -Ei '(combat|fight|attack|guard|panic|flee|help|alarm|hurt|revenge|retaliat|weapon|inventory)' | head -n 350 || true

          echo '=== BETTER SUBS CANDIDATE CAST / AI CLASSES ==='
          jar tf "$BETTER" | grep '\.class$' | grep -Ei '(cast|skill.*goal|goal.*skill|skill.*ai|ai.*skill|activate|passive)' | head -n 200 || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
