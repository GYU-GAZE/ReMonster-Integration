name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Capture focused EP drain diagnostics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ep-drain-diagnostics/better-subs build/ep-drain-diagnostics/tensura
          BS=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          TENSURA=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          printf 'BETTER_SUBS=%s\nTENSURA=%s\n' "$BS" "$TENSURA" > build/ep-drain-diagnostics/artifacts.txt

          javap -classpath "$BS" -p -c com.trbeyond.tensura_better_subs.entity.ExpandedSkillStorage \
            > build/ep-drain-diagnostics/better-subs/ExpandedSkillStorage.txt 2>&1 || true
          javap -classpath "$BS" -p -c com.trbeyond.tensura_better_subs.BetterSubs \
            > build/ep-drain-diagnostics/better-subs/BetterSubs.txt 2>&1 || true
          jar tf "$BS" | grep '\.class$' | sed 's#/#.#g;s#\.class$##' \
            | grep -Ei 'event|handler|mixin|damage|existence|expanded|living|entity|skill' \
            > build/ep-drain-diagnostics/better-subs/candidate-classes.txt || true

          javap -classpath "$TENSURA" -p -c io.github.manasmods.tensura.storage.ep.ExistenceStorage \
            > build/ep-drain-diagnostics/tensura/ExistenceStorage.txt 2>&1 || true
          javap -classpath "$TENSURA" -p -c io.github.manasmods.tensura.util.EnergyHelper \
            > build/ep-drain-diagnostics/tensura/EnergyHelper.txt 2>&1 || true
          jar tf "$TENSURA" | grep '\.class$' | sed 's#/#.#g;s#\.class$##' \
            | grep -Ei 'existence|energy|damage|ep|death|living.*event|entity.*event' \
            > build/ep-drain-diagnostics/tensura/candidate-classes.txt || true

          grep -RniE 'entityEPUpdate|existenceUpdated|setEP|setGainedEP|getEP|getGainedEP|damageTaken|\.hurt| hurt|DamageSource|setHealth|kill\(|discard\(' \
            build/ep-drain-diagnostics \
            > build/ep-drain-diagnostics/interesting-lines.txt || true

      - name: Upload EP drain diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ep-drain-diagnostics
          path: build/ep-drain-diagnostics/**

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
