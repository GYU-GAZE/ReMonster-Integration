name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect Better Subordinates EP progression internals
        if: success()
        shell: bash
        run: |
          BS=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          TENSURA=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          echo "BETTER_SUBS=$BS"
          echo "TENSURA=$TENSURA"
          echo '=== BETTER SUBS RELEVANT CLASSES ==='
          jar tf "$BS" | grep -Ei 'ExpandedSkillStorage|Existence|Damage|Event|Mixin.*(Living|Entity|EP)|Handler' || true
          echo '=== EXPANDED SKILL STORAGE ==='
          javap -classpath "$BS" -p -c com.trbeyond.tensura_better_subs.entity.ExpandedSkillStorage
          echo '=== EXPANDED SKILL CONFIG ==='
          javap -classpath "$BS" -p -c com.trbeyond.tensura_better_subs.config.ExpandedSkillConfig || true
          echo '=== BETTER SUBS ROOT ==='
          javap -classpath "$BS" -p -c com.trbeyond.tensura_better_subs.BetterSubs
          echo '=== TENSURA RELEVANT CLASSES ==='
          jar tf "$TENSURA" | grep -Ei 'ExistenceStorage|EnergyHelper|Existence.*Event|Mixin.*Existence|EP.*Event' || true
          echo '=== TENSURA EXISTENCE STORAGE ==='
          javap -classpath "$TENSURA" -p -c io.github.manasmods.tensura.storage.ep.ExistenceStorage || true
          echo '=== TENSURA ENERGY HELPER ==='
          javap -classpath "$TENSURA" -p -c io.github.manasmods.tensura.util.EnergyHelper || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
