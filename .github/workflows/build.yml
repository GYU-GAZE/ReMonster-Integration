name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect native name-evolution trigger
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          test -n "$JAR"

          echo '=== INameEvolution ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.entity.template.subclass.INameEvolution

          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.entity.monster.DirewolfEntity > /tmp/direwolf.bytecode
          echo '=== DIREWOLF canBeNamed ==='
          grep -F -A 80 'public boolean canBeNamed' /tmp/direwolf.bytecode || true
          echo '=== DIREWOLF evolution state accessors ==='
          grep -E -A 35 'public int get(Max|Current)EvolutionState|public void setCurrentEvolutionState' /tmp/direwolf.bytecode || true
          echo '=== DIREWOLF onPreNamed ==='
          grep -F -A 180 'public void onPreNamed' /tmp/direwolf.bytecode || true

          echo '=== REQUEST NAMING MENU ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.network.c2s.RequestNamingMenuPacket | grep -E -B 35 -A 90 'INameEvolution|onPreNamed|evolve|canBeNamed' || true

          echo '=== REQUEST NAMING KEY ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.network.c2s.RequestNamingKeyPacket | grep -E -B 35 -A 90 'INameEvolution|onPreNamed|evolve|canBeNamed' || true

          echo '=== RACE HELPER ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.race.RaceHelper | grep -E -B 35 -A 90 'INameEvolution|onPreNamed|evolve' || true

      - name: Inspect Better Subordinates status transition
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.client.screen.MixinHumanoidMainScreen
          echo '=== OPEN PAYLOAD ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.network.s2c.OpenHumanoidSkillMenuPayload
          echo '=== THOUGHT COMM MIXIN ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
