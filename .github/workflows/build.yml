name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Locate native name-evolution trigger
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          test -n "$JAR"
          TMP=$(mktemp -d)
          cd "$TMP"
          jar xf "$JAR"

          echo '=== NAME-EVOLUTION CLASSES ==='
          find . -type f -iname '*Name*Evol*.class' -o -iname '*Evol*Name*.class' | sort

          echo '=== CLASSES REFERENCING INameEvolution ==='
          grep -R -a -l 'INameEvolution' io/github/manasmods/tensura 2>/dev/null | sort | head -n 80

          echo '=== DIREWOLF NAME / EVOLUTION METHODS ==='
          javap -classpath "$JAR" -p io.github.manasmods.tensura.entity.monster.DirewolfEntity | grep -Ei 'name|evol|variant|star' || true

      - name: Inspect Better Subordinates status transition
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.client.screen.MixinHumanoidMainScreen
          echo '=== OPEN PAYLOAD ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.network.s2c.OpenHumanoidSkillMenuPayload
          echo '=== THOUGHT COMM MIXIN ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
