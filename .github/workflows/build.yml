name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect universal character APIs
        if: success()
        shell: bash
        run: |
          TENSURA=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          MCA=$(find ~/.gradle/caches -type f -name '*8658484*.jar' | head -n 1)
          BETTER=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          MC_CP="$TENSURA:build/manascore-compile-modules/*"

          echo '=== MANASCORE SKILL ACTIVATION CONTRACT ==='
          javap -classpath "$MC_CP" -p io.github.manasmods.manascore.skill.api.ManasSkill || true
          javap -classpath "$MC_CP" -p io.github.manasmods.manascore.skill.api.ManasSkillInstance || true
          javap -classpath "$MC_CP" -p io.github.manasmods.manascore.skill.impl.SkillStorage || true

          echo '=== TENSURA ACTIVATION PAYLOADS / HANDLERS ==='
          jar tf "$TENSURA" | grep '\.class$' | grep -Ei '(ability|skill).*(payload|packet|press|release|activate|key)|network.*(ability|skill)' | head -n 300 || true

          echo '=== REPRESENTATIVE ACTIVE ABILITIES ==='
          javap -classpath "$MC_CP" -p -c io.github.manasmods.tensura.ability.battlewill.projectile.MagicBulletArt || true
          javap -classpath "$MC_CP" -p -c io.github.manasmods.tensura.ability.battlewill.melee.AuraSlashArt || true
          javap -classpath "$MC_CP" -p -c io.github.manasmods.tensura.ability.battlewill.utility.AuraShieldArt || true

          echo '=== TEACHING ITEMS ==='
          javap -classpath "$MC_CP" -p -c io.github.manasmods.tensura.item.misc.BattlewillManualItem || true
          javap -classpath "$MC_CP" -p -c io.github.manasmods.tensura.item.misc.MagicTomeItem || true

          echo '=== BETTER SUBORDINATES STORAGE ==='
          javap -classpath "$BETTER:$MC_CP" -p -c com.trbeyond.tensura_better_subs.storage.ExpandedSkillStorage || true
          jar tf "$BETTER" | grep '\.class$' | grep -Ei 'ExpandedSkillStorage|SkillExpansion|Storage' | head -n 100 || true

          echo '=== MCA VILLAGER / BRAIN CLASS INVENTORY ==='
          jar tf "$MCA" | grep '\.class$' | grep -Ei 'Villager.*class$|brain/(tasks|sensor)/.*class$|Inventory' | head -n 500 || true

          echo '=== MCA COMBAT TASKS ==='
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.tasks.ExtendedMeleeAttackTask || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.tasks.ExtendedCrossbowAttackTask || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.sensor.GuardEnemiesSensor || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.UpdatableInventory || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
