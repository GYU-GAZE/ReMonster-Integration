name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Resolve exact Tensura jar
        run: gradle compileJava
      - name: Inspect mount interaction only
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          for C in io.github.manasmods.tensura.entity.template.TensuraMountEntity io.github.manasmods.tensura.entity.template.TensuraRideableEntity; do
            echo "===== $C getRidingInteraction ====="
            javap -classpath "$JAR" -p -c "$C" | awk '
              /getRidingInteraction\(/ {show=1}
              show {print}
              show && /^$/ {show=0}
            '
          done
