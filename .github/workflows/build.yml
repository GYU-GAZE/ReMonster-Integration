name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect final integration points
        if: success()
        shell: bash
        run: |
          TENSURA=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          MCA=$(find ~/.gradle/caches -type f -name '*8658484*.jar' | head -n 1)
          BETTER=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          MC_CP="$TENSURA:build/manascore-compile-modules/*"

          echo '=== SKILL STORAGE HOLD / RELEASE ==='
          javap -classpath "$MC_CP" -p -c io.github.manasmods.manascore.skill.impl.SkillStorage || true

          echo '=== BETTER SUBS EXPANDED STORAGE ==='
          javap -classpath "$BETTER:$MC_CP" -p -c com.trbeyond.tensura_better_subs.entity.ExpandedSkillStorage || true

          echo '=== TENSURA EVOLUTION MOB IDS ==='
          jar tf "$TENSURA" | grep -Ei 'hound|direwolf|barghest' | head -n 100 || true
          javap -classpath "$MC_CP" -p io.github.manasmods.tensura.registry.entity.TensuraEntityTypes 2>/dev/null | grep -Ei 'hound|dire|barghest' || true
          javap -classpath "$MC_CP" -p io.github.manasmods.tensura.registry.entity.TensuraEntities 2>/dev/null | grep -Ei 'hound|dire|barghest' || true
          unzip -p "$TENSURA" 2>/dev/null | strings | grep -Ei 'hound_dog|direwolf|barghest' | sort -u | head -n 100 || true

          echo '=== MCA BRAIN / TASK REGISTRATION ==='
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.VillagerBrain || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.VillagerTasksMCA || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.VillagerEntityMCA || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.tasks.EquipmentTask || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.tasks.BowTask || true
          javap -classpath "$MCA" -p -c net.conczin.mca.entity.ai.brain.tasks.ArcherMovementTask || true

          echo '=== MCA HELP / PANIC STRINGS AND CALLERS ==='
          strings "$MCA" | grep -Ei 'villager\.(help|panic|attack|hurt)|help|panic' | head -n 200 || true
          jar tf "$MCA" | grep '\.class$' | grep -Ei '(panic|help|alarm|messenger|damage|hurt)' | head -n 250 || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
