name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect targeting semantics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          echo "TENSURA_JAR=$JAR"
          echo '=== TARGETING-RELATED CLASSES ==='
          jar tf "$JAR" | grep -E 'ThoughtCommunicationSkill|TelepathySkill|SubordinateHelper|ISubordinate|SkillRegistry|Skills.class' | head -n 200 || true
          echo '=== ISubordinate ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.entity.template.subclass.ISubordinate
          echo '=== SubordinateHelper ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.util.SubordinateHelper
          echo '=== ThoughtCommunicationSkill ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.ability.skill.common.ThoughtCommunicationSkill
          echo '=== TelepathySkill ==='
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.ability.skill.common.TelepathySkill
          echo '=== STRING CANDIDATES ==='
          strings "$JAR" | grep -Ei 'thought.?communication|thought_communication|telepathy' | head -n 100 || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
