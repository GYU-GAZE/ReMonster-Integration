name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect Tensura Direwolf evolution bytecode
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8665599*.jar' | head -n 1)
          test -n "$JAR"
          javap -classpath "$JAR" -p io.github.manasmods.tensura.entity.monster.DirewolfEntity > /tmp/direwolf.methods
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.entity.monster.DirewolfEntity > /tmp/direwolf.bytecode
          javap -classpath "$JAR" -p -c io.github.manasmods.tensura.entity.variant.DirewolfVariant > /tmp/variant.bytecode

          echo '=== STAR / STATE / SPAWN METHOD LIST ==='
          grep -Ei 'star|alpha|evol|variant|finalizeSpawn|typeVariant' /tmp/direwolf.methods || true

          echo '=== MAX EVOLUTION STATE ==='
          grep -F -A 25 'public int getMaxEvolutionState();' /tmp/direwolf.bytecode || true

          echo '=== STAR ACCESSORS ==='
          grep -F -A 25 'public boolean isStar();' /tmp/direwolf.bytecode || true
          grep -F -A 25 'public void setStar(boolean);' /tmp/direwolf.bytecode || true

          echo '=== TYPE VARIANT ==='
          grep -F -A 35 'private int getTypeVariant();' /tmp/direwolf.bytecode || true

          echo '=== TEMPEST / STAR SPAWN CONTEXT ==='
          grep -F -B 70 -A 120 'DirewolfVariant.TEMPEST_WOLF' /tmp/direwolf.bytecode || true

          echo '=== DIREWOLF VARIANT STATIC INITIALIZER ==='
          grep -F -A 420 'static {};' /tmp/variant.bytecode || true

      - name: Inspect Better Subordinates status transition
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.client.screen.MixinHumanoidMainScreen
          echo '=== OPEN PAYLOAD ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.network.s2c.OpenHumanoidSkillMenuPayload
          echo '=== THOUGHT COMM MIXIN ==='
          javap -classpath "$JAR" -p -c com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
