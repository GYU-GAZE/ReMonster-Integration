name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect Better Subordinates status menu bytecode
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          echo "BETTER_SUBS_JAR=$JAR"
          for CLASS in \
            com.trbeyond.tensura_better_subs.client.screen.MainScreenSubordinate \
            com.trbeyond.tensura_better_subs.client.screen.ScreenHelperSubordinates \
            com.trbeyond.tensura_better_subs.client.screen.AbilityCategoriesScreenEntity \
            com.trbeyond.tensura_better_subs.network.s2c.OpenHumanoidSkillMenuPayload \
            com.trbeyond.tensura_better_subs.mixin.tensura.client.screen.MixinHumanoidMainScreen \
            com.trbeyond.tensura_better_subs.mixin.tensura.ability.skill.common.MixinThoughtCommunicationSkill; do
            echo "=== $CLASS ==="
            javap -classpath "$JAR" -p -c "$CLASS" || true
          done

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
