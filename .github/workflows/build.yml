name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect Better Subordinates UI surface
        if: success()
        shell: bash
        run: |
          JAR=$(find ~/.gradle/caches -type f -name '*8414486*.jar' | head -n 1)
          echo "BETTER_SUBS_JAR=$JAR"
          if [ -z "$JAR" ]; then
            echo "Better Subordinates jar not found"
            exit 1
          fi
          echo '=== RELEVANT CLASSES ==='
          jar tf "$JAR" | grep '\.class$' | grep -Ei 'screen|menu|payload|packet|thought|skill|inventory|container' || true
          echo '=== ALL MOD CLASSES ==='
          jar tf "$JAR" | grep '^com/trbeyond/tensura_better_subs/.*\.class$' || true

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: remonster-integration
          path: build/libs/*.jar
